name: Build Android APK

on:
  workflow_dispatch: # Manual build trigger

permissions:
  contents: write 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Execute abcd.sh (No Commit Yet)
      run: |
        if [ -f "abcd.sh" ]; then
          echo "abcd.sh found. Fixing line endings..."
          sed -i 's/\r$//' abcd.sh
          
          echo "Applying CI Immunity: Stripping rogue Git commands..."
          sed -i '/git commit/d; /git push/d; /git add/d; /git config/d' abcd.sh
          
          echo "Executing sanitized script..."
          chmod +x abcd.sh
          bash abcd.sh
          echo "Script executed."
          
          echo ""
          echo "📊 SCRIPT MODIFICATION SUMMARY:"
          git diff --stat
          echo ""
        else
          echo "abcd.sh not found."
        fi

    - name: Enforce Changelog Size Limit
      run: |
        if [ -f "AI_CHANGELOG.md" ]; then
          echo "Trimming AI_CHANGELOG.md to keep only the 50 most recent entries..."
          tail -n 50 AI_CHANGELOG.md > temp_changelog.md
          mv temp_changelog.md AI_CHANGELOG.md
        fi

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle clean assembleDebug | tee build_log.txt

    - name: Empty abcd.sh and Push Code Changes on Success
      run: |
        if [ -f "abcd.sh" ]; then
          > abcd.sh
        fi

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        git reset HEAD app/src/main/assets/ app/build/ staging/ build_log.txt 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "No source code changes detected. Skipping commit."
        else
          echo "Source code changes detected. Committing modified codebase safely..."
          git commit -m "chore: executed abcd.sh, trimmed AI_CHANGELOG, and applied AI patches [skip ci]"
          
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
        fi
            
    - name: Generate Failure Context & Revert Code
      if: failure()
      run: |
        echo "Build failed. Generating comprehensive failure report..."
        REPORT="failure_context.txt"
        
        echo "========== 1. THE SCRIPT (abcd.sh) ==========" > $REPORT
        cat abcd.sh 2>/dev/null >> $REPORT || echo "abcd.sh not found." >> $REPORT
        echo -e "\n\n" >> $REPORT
        
        echo "========== 2. BUILD ERRORS ==========" >> $REPORT
        if [ -f "build_log.txt" ]; then
          grep -A 100 -B 2 "e: " build_log.txt > extracted_errors.txt || true
          if [ -s extracted_errors.txt ]; then
             cat extracted_errors.txt >> $REPORT
          else
             tail -n 150 build_log.txt >> $REPORT
          fi
        else
          echo "No build_log.txt found!" >> $REPORT
        fi
        echo -e "\n\n" >> $REPORT
        
        echo "========== 3. TARGETED FILES (UNEDITED STATE) ==========" >> $REPORT
        MODIFIED_FILES=$(git diff --name-only)
        
        git reset --hard
        
        for file in $MODIFIED_FILES; do
          if [[ "$file" != "AI_CHANGELOG.md" && "$file" != "abcd.sh" && -f "$file" ]]; then
             echo "--- FILE: $file ---" >> $REPORT
             cat "$file" >> $REPORT
             echo -e "\n" >> $REPORT
          fi
        done
        echo -e "\n\n" >> $REPORT
        
        echo "========== 4. AI RULE BOOK (AI_INSTRUCTIONS.md) ==========" >> $REPORT
        cat AI_INSTRUCTIONS.md 2>/dev/null >> $REPORT || echo "Not found." >> $REPORT
        echo -e "\n\n" >> $REPORT
        
        echo "========== 5. AI HISTORY (AI_CHANGELOG.md) ==========" >> $REPORT
        cat AI_CHANGELOG.md 2>/dev/null >> $REPORT || echo "Not found." >> $REPORT

    - name: Prepare APK Asset
      run: |
        mkdir -p staging/
        cp app/build/outputs/apk/debug/app-debug.apk staging/RunningTracker.apk

    - name: Generate Repository Codebase Map
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Cloning a pristine copy of the repository directly from GitHub..."
        git clone --depth 1 --branch ${{ github.ref_name }} https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git pristine_workspace

        cat << 'PYEOF' > generate_repo_map_raw.py
        import os
        import io

        repo = os.environ.get('GITHUB_REPOSITORY', 'unknown/repo')
        branch = os.environ.get('GITHUB_REF_NAME', 'unknown_branch')
        target_dir = 'pristine_workspace' 

        ignore_dirs = {'.git', '.gradle', 'build', 'staging'}
        ignore_files = {
            'generate_repo_map.py',
            'repo_download_all.txt',
            'failure_context.txt'
        }

        all_items = []
        file_contents_dict = {}

        for root, dirs, files in os.walk(target_dir):
            parts = root.split(os.sep)
            if any(d in parts for d in ignore_dirs):
                continue

            rel_root = os.path.relpath(root, target_dir)
            if rel_root != '.':
                rel_root_norm = rel_root.replace(os.sep, '/')
                root_parts = rel_root_norm.split('/')
                if any(x in root_parts for x in ['build', '.gradle', 'staging']):
                    continue
                all_items.append({'type': 'tree', 'path': rel_root_norm})

            for f in files:
                if f in ignore_files:
                    continue
                
                rel_path = os.path.relpath(os.path.join(root, f), target_dir)
                rel_path_norm = rel_path.replace(os.sep, '/')
                file_parts = rel_path_norm.split('/')
                if any(x in file_parts[:-1] for x in ['build', '.gradle', 'staging']):
                    continue

                all_items.append({'type': 'blob', 'path': rel_path_norm})

                try:
                    with open(os.path.join(root, f), 'r', encoding='utf-8') as file_in:
                        file_contents_dict[rel_path_norm] = file_in.read()
                except UnicodeDecodeError:
                    pass
                except Exception:
                    pass

        all_items.sort(key=lambda x: x['path'])

        out = io.StringIO()
        out.write("<repository>\n")
        out.write("<metadata>\n")
        out.write(f"  <repository_name>{repo}</repository_name>\n")
        out.write(f"  <branch>{branch}</branch>\n")
        out.write("  <download_mode>all</download_mode>\n")
        out.write("</metadata>\n\n")
        out.write("IMPORTANT: Must follow the instructions written in AI_INSTRUCTIONS.md and AI_CHANGELOG.md contains the recent changes in the repo from bottom(most recent) towards the top (earlier changes)\n\n")

        out.write("<directory_structure>\n")
        for item in all_items:
            out.write(f"{item['type']}: {item['path']}\n")
        out.write("</directory_structure>\n\n")

        lang_map = {
            'py': 'python', 'js': 'javascript', 'ts': 'typescript',
            'html': 'html', 'css': 'css', 'json': 'json',
            'md': 'markdown', 'yml': 'yaml', 'yaml': 'yaml',
            'xml': 'xml', 'kt': 'kotlin', 'java': 'java',
            'gradle': 'groovy', 'sh': 'bash', 'txt': 'text',
            'c': 'c', 'cpp': 'cpp', 'h': 'c', 'hpp': 'cpp'
        }

        out.write("<files>\n")
        for item in all_items:
            path = item['path']
            if path in file_contents_dict:
                file_text = file_contents_dict[path]
                ext = path.split('.')[-1].lower() if '.' in path else ''
                lang = lang_map.get(ext, 'plaintext')
                line_count = len(file_text.splitlines())
                
                out.write(f'<file path="{path}" language="{lang}" lines="{line_count}">\n')
                safe_text = file_text.replace("]]]]><![CDATA[>", "]]]]]]><![CDATA[><![CDATA[>")
                out.write("<![CDATA[\n")
                out.write(safe_text)
                if not safe_text.endswith('\n'):
                    out.write('\n')
                out.write("]]]]><![CDATA[>\n")
                out.write('</file>\n')
        out.write("</files>\n")
        out.write("</repository>\n")

        with open("repo_download_all.txt", "w", encoding="utf-8") as f:
            f.write(out.getvalue())
        print("Successfully generated repository codebase map from the fresh GitHub clone.")
        PYEOF
        python3 -c "import textwrap; open('generate_repo_map.py', 'w').write(textwrap.dedent(open('generate_repo_map_raw.py').read()))"
        python3 generate_repo_map.py
        rm -f generate_repo_map_raw.py generate_repo_map.py

    - name: Create Release & Upload Final Assets
      if: always()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Running Tracker APK (Build ${{ github.run_number }})
        files: |
          staging/RunningTracker.apk
          repo_download_all.txt
          failure_context.txt
        fail_on_unmatched_files: false
